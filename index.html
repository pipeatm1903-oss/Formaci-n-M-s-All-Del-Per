<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Más Allá Del PER">
<meta name="theme-color" content="#f2ede2">
<title>Más Allá Del PER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2ede2; --ink:#1b1a17; --mute:#8a8578; --rule:#cfc7b5;
  --accent:#1e5a43; --tick:#ddd5c3; --press:#e7e0d0;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#14130f; --ink:#ece6d8; --mute:#8d887c; --rule:#3a372f;
         --accent:#6fbf98; --tick:#2c2a24; --press:#221f19; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink)}
body{
  font-family:'Fraunces',Georgia,serif;
  padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 40px);
  max-width:560px;margin:0 auto;
  -webkit-user-select:none;user-select:none;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* ---------- Cabecera ---------- */
.kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.big{display:flex;align-items:flex-end;gap:10px;margin:6px 0 2px}
.pct{font-weight:900;font-size:112px;line-height:.85;letter-spacing:-.04em;
  font-variation-settings:"opsz" 144}
.pct small{font-size:44px;font-weight:700;margin-left:2px}
.side{padding-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mute);line-height:1.5}
.side b{color:var(--ink);font-weight:600}

.ticks{display:flex;gap:2px;height:30px;margin:16px 0 6px}
.ticks i{flex:1;background:var(--tick);transition:background .25s}
.ticks i.on{background:var(--ink)}
.ticks i.last{background:var(--accent)}
.scale{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--mute)}

/* ---------- Libro de categorías ---------- */
h2{font-size:13px;font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;margin:38px 0 0;padding-bottom:8px;border-bottom:3px double var(--ink);
  display:flex;justify-content:space-between}
h2 span{color:var(--mute);font-weight:400}

.row{display:grid;grid-template-columns:28px 1fr auto;gap:0 10px;align-items:center;
  padding:16px 0 14px;border-bottom:1px solid var(--rule)}
.num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute);align-self:start;padding-top:5px}
.name{font-size:19px;font-weight:700;line-height:1.15}
.name em{font-style:normal;margin-right:6px}
.sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute);margin-top:4px}
.count{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;text-align:right;white-space:nowrap}
.count span{color:var(--mute);font-weight:400;font-size:14px}
.line{grid-column:2/4;height:4px;background:var(--tick);margin-top:12px;position:relative}
.line b{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .3s}
.row.done .line b{background:var(--accent)}
.row.done .name{color:var(--accent)}
.ctrl{grid-column:2/4;display:flex;gap:8px;margin-top:12px}
button{font-family:'JetBrains Mono',monospace;background:transparent;color:var(--ink);
  border:1.5px solid var(--ink);border-radius:0;font-size:15px;font-weight:600;cursor:pointer;
  touch-action:manipulation}
button:active{background:var(--press)}
.minus{width:46px;height:44px;border-color:var(--rule);color:var(--mute)}
.plus{flex:1;height:44px;letter-spacing:.06em}
.row.done .plus{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.3}

/* tesis: casilla */
.chk{width:44px;height:44px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:22px}
.row.done .chk{background:var(--accent);border-color:var(--accent);color:var(--paper)}

.foot{margin-top:34px;display:flex;justify-content:space-between;align-items:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute)}
.foot button{border:none;color:var(--mute);font-size:11px;text-decoration:underline;padding:6px 0}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);
  background:var(--ink);color:var(--paper);font-family:'JetBrains Mono',monospace;font-size:13px;
  padding:10px 16px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="kicker"><span>Formación Más Allá Del PER</span><span id="fecha"></span></div>
<div class="big">
  <div class="pct" id="pct">0<small>%</small></div>
  <div class="side"><b id="hechos">0</b> de <b id="total">0</b><br>completados<br><span id="hoy"></span></div>
</div>
<div class="ticks" id="ticks"></div>
<div class="scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>

<h2>Vídeos <span id="vidSum"></span></h2>
<div id="cats"></div>

<h2>Tesis de inversión <span id="tesSum"></span></h2>
<div id="tesis"></div>

<div class="foot">
  <span id="ult"></span>
  <button id="reset">Reiniciar</button>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = [
  {id:'fg',  e:'🗂️', n:'Formación contable',          t:17},
  {id:'gc',  e:'📊', n:'Gestión de carteras',         t:19},
  {id:'cc',  e:'📒', n:'Conceptos contables',         t:33},
  {id:'pi',  e:'🧠', n:'Psicología de la inversión',  t:39},
  {id:'ec',  e:'📖', n:'Empezar desde cero',          t:16},
];
const TESIS = [
  {id:'kk',   e:'🥛', n:'Kri-Kri', s:'Comprada a 6 €'},
  {id:'asml', e:'🏭', n:'ASML',    s:'Comprada a 570 €'},
];
const KEY = 'formacion-v1';
const TOTAL = CATS.reduce((a,c)=>a+c.t,0) + TESIS.length;

let st = {v:{}, t:{}, log:[]};
try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) st = Object.assign(st,s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

const today = () => new Date().toISOString().slice(0,10);
function logIt(d){ st.log.push({d:today(), n:d, ts:Date.now()}); if(st.log.length>2000) st.log.shift(); }

function done(){
  return CATS.reduce((a,c)=>a+(st.v[c.id]||0),0) + TESIS.filter(x=>st.t[x.id]).length;
}

/* ticks */
const ticksEl = document.getElementById('ticks');
const N = 50;
for(let i=0;i<N;i++) ticksEl.appendChild(document.createElement('i'));

function render(){
  const d = done(), p = d/TOTAL*100;
  document.getElementById('pct').innerHTML = (p<10 && p>0 ? p.toFixed(1) : Math.floor(p)) + '<small>%</small>';
  document.getElementById('hechos').textContent = d;
  document.getElementById('total').textContent = TOTAL;
  const on = Math.round(p/100*N);
  [...ticksEl.children].forEach((el,i)=>{ el.className = i<on ? (i===on-1 ? 'on last':'on') : ''; });

  const hoy = st.log.filter(x=>x.d===today()).reduce((a,x)=>a+x.n,0);
  document.getElementById('hoy').textContent = hoy>0 ? `+${hoy} hoy` : '';

  const vd = CATS.reduce((a,c)=>a+(st.v[c.id]||0),0), vt = CATS.reduce((a,c)=>a+c.t,0);
  document.getElementById('vidSum').textContent = `${vd}/${vt}`;
  document.getElementById('tesSum').textContent = `${TESIS.filter(x=>st.t[x.id]).length}/${TESIS.length}`;

  document.getElementById('cats').innerHTML = CATS.map((c,i)=>{
    const v = st.v[c.id]||0, full = v>=c.t;
    return `<div class="row ${full?'done':''}">
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div><div class="name"><em>${c.e}</em>${c.n}</div></div>
      <div class="count">${v}<span>/${c.t}</span></div>
      <div class="line"><b style="width:${v/c.t*100}%"></b></div>
      <div class="ctrl">
        <button class="minus" data-m="${c.id}" ${v<=0?'disabled':''}>−</button>
        <button class="plus" data-p="${c.id}" ${full?'disabled':''}>${full?'COMPLETADO ✓':'+ 1 VÍDEO'}</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('tesis').innerHTML = TESIS.map((x,i)=>{
    const ok = !!st.t[x.id];
    return `<div class="row ${ok?'done':''}">
      <div class="num">T${i+1}</div>
      <div><div class="name"><em>${x.e}</em>${x.n}</div><div class="sub">${x.s}</div></div>
      <button class="chk" data-t="${x.id}">${ok?'✓':''}</button>
    </div>`;
  }).join('');

  const last = st.log[st.log.length-1];
  document.getElementById('ult').textContent = last ? 'Último avance: ' + new Date(last.ts).toLocaleDateString('es-ES',{day:'numeric',month:'short'}) : '';
}

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'),1400);
}

document.body.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.p){
    const c = CATS.find(x=>x.id===b.dataset.p), v = st.v[c.id]||0;
    if(v>=c.t) return;
    st.v[c.id] = v+1; logIt(1);
    toast(st.v[c.id]===c.t ? `${c.n} completado 🎉` : `${c.n}: ${v+1}/${c.t}`);
  } else if(b.dataset.m){
    const id = b.dataset.m; if((st.v[id]||0)<=0) return;
    st.v[id]--; logIt(-1);
  } else if(b.dataset.t){
    const id = b.dataset.t; st.t[id] = !st.t[id]; logIt(st.t[id]?1:-1);
    if(st.t[id]) toast('Tesis terminada ✓');
  } else if(b.id==='reset'){
    if(!confirm('¿Borrar todo el progreso?')) return;
    st = {v:{}, t:{}, log:[]};
  } else return;
  save(); render();
  if(done()===TOTAL) toast('Formación completa 🏁');
});

document.getElementById('fecha').textContent = new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
render();
</script>
</body>
</html>
